version: '3.8'

services:
  db:
    build: db/.
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: world
    ports:
      - "3307:3306" # Maps MySQL port to your host machine so IDE can connect directly

  app:
    build: .
    depends_on:
      - db
    environment:
      DB_HOST: "db:3306" # Injects the container database address for Docker runs
    stdin_open: true # Enables standard input (kbd input)
    tty: true        # Allocates a pseudo-TTY terminal
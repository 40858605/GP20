services:
  db:
    build: db/.
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: world
    ports:
      - "3307:3306" # Maps MySQL port to your host machine so IDE can connect directly
      #change the port from 3307 to 3306 or vice versa if your docker DB can't connect
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pexample"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: "db:3306" # Injects the container database address for Docker runs
    stdin_open: true # Enables standard input (kbd input)
    tty: true        # Allocates a pseudo-TTY terminal
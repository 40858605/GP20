  name: CI Workflow for World Database App

  on:
    push:
      branches: ["main", "master", "develop", "test/**", "feature/**"]
    pull_request:
      branches: ["main", "master", "develop"]

  permissions:
    contents: write

  jobs:
    UnitTests:
      name: Unit Tests
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            submodules: recursive

        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: "17"
            distribution: temurin
            cache: maven

        - name: Run Unit Tests
          # Skip integration tests because the database is not running yet
          run: mvn test -Dtest="*Test,!*IntegrationTest"

        - name: Generate JaCoCo Coverage Report
          run: mvn org.jacoco:jacoco-maven-plugin:0.8.13:report

        - name: Generate Coverage Badge
          uses: cicirello/jacoco-badge-generator@v2
          with:
            jacoco-csv-file: target/site/jacoco/jacoco.csv
            generate-coverage-badge: true
            generate-branches-badge: true
            coverage-badge-filename: coverage.svg
            branches-badge-filename: branches.svg

        - name: Commit Coverage Badges
          if: github.event_name == 'push'
          run: |
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            
            git add .github/badges/
            
            if ! git diff --cached --quiet; then
              git commit -m "Update coverage badges"
              git push
            fi

    IntegrationTests:
      name: Integration Tests
      runs-on: ubuntu-latest
      needs: UnitTests

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            submodules: recursive

        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: "17"
            distribution: temurin
            cache: maven

        - name: Start Database & Run Integration Tests
          run: |
            docker compose up -d db
            sleep 20
            mvn test -Dtest="*IntegrationTest"
            docker compose down -v

    build:
      name: Build & Test via Docker Compose
      runs-on: ubuntu-latest
      needs: IntegrationTests
      timeout-minutes: 10

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            submodules: recursive

        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: "17"
            distribution: temurin
            cache: maven

        - name: Build executable JAR with Maven
          # Tests have already passed in previous jobs
          run: mvn --batch-mode clean package -DskipTests

        - name: Run Docker Compose
          run: docker compose up --build --abort-on-container-exit --exit-code-from app

        - name: Stop Docker Compose
          if: always()
          run: docker compose down -v

        - name: Publish JAR to GitHub Releases
          if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
          uses: softprops/action-gh-release@v2
          with:
            tag_name: latest
            name: Latest Build
            make_latest: true
            generate_release_notes: true
            files: target/assessment_1-1.0-SNAPSHOT-jar-with-dependencies.jar
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
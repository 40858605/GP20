name: CI Workflow for World Database App

on:
  push:
    branches: ["main", "master", "develop", "test/**", "feature/**"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run Unit Tests
        # skip integration tests here because the database is not running yet
        run: mvn test -Dtest="*Test,!*IntegrationTest"

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: UnitTests # this runs only if unit tests pass first
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Start Database & Run Integration Tests
        run: |
          docker compose up -d db
          sleep 20 
          mvn test -Dtest="*IntegrationTest"
          docker compose down -v

  build:
    name: Build & Test via Docker Compose
    runs-on: ubuntu-latest
    needs: IntegrationTests # only builds final application if ALL tests pass
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build executable JAR with Maven
        # Added -DskipTests so Maven doesn't crash trying to rerun tests
        run: mvn --batch-mode clean package -DskipTests

      - name: Run Docker Compose
        run: docker compose up --build --abort-on-container-exit --exit-code-from app

      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v